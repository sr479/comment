# 证书签发成功后，以此配置替换本站的 nginx-http.conf。
# 不要改动现有业务的虚拟主机；不使用 default_server、不添加通配域名。
server {
    listen 80;
    listen [::]:80;
    server_name pingjia.xiangzhen.site;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/fanmaxi-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pingjia.xiangzhen.site;
    ssl_certificate /etc/letsencrypt/live/pingjia.xiangzhen.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pingjia.xiangzhen.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/fanmaxi-error.log warn;
    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:3086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
