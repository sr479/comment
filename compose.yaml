services:
  feedback:
    build: .
    init: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3086:3086"
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?请在 .env 中设置 PUBLIC_ORIGIN}
      ICP_NUMBER: ${ICP_NUMBER:-}
      # Docker 端口转发后的对端为宿主机网桥；端口仅绑定到宿主机回环地址。
      TRUST_PROXY: "1"
    volumes:
      - feedback_data:/app/data
      - feedback_backups:/app/backups
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  feedback_data:
  feedback_backups:
